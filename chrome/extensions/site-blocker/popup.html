<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトブロッカー</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 250px;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            cursor: pointer;
        }

        input {
            width: calc(100% - 16px);
            padding: 6px;
            margin: 5px 0;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
    </style>
</head>

<body>
    <h3>サイトブロッカー</h3>

    <button id="blockCurrent">このサイトをブロック</button>

    <input type="text" id="manualDomain" placeholder="ドメインを入力">
    <button id="addDomain">追加</button>

    <h4>ブロックリスト</h4>
    <ul id="blockedList"></ul>

    <script src="popup.js"></script>
</body>

</html>
