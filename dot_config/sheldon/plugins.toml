shell = "zsh"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["fpath"]

# compinit must run BEFORE fzf-tab
[plugins.compinit]
inline = '''
# Add Nix/home-manager completions to fpath
if [[ -d "$HOME/.nix-profile/share/zsh/site-functions" ]]; then
  fpath=("$HOME/.nix-profile/share/zsh/site-functions" $fpath)
fi
autoload -Uz compinit
_comp_dump="${XDG_CACHE_HOME:-$HOME/.cache}/zsh/zcompdump"
[[ -d "${_comp_dump:h}" ]] || mkdir -p "${_comp_dump:h}"
if [[ -n "$_comp_dump"(#qN.mh+24) ]]; then
  compinit -d "$_comp_dump"
else
  compinit -C -d "$_comp_dump"
fi
unset _comp_dump
autoload -Uz bashcompinit && bashcompinit
'''

# Tool init (installed via home-manager, init via sheldon since chezmoi manages .zshrc)
# fzf must load BEFORE fzf-tab so fzf-tab can override the TAB binding
[plugins.fzf]
inline = 'eval "$(fzf --zsh)"'

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"

# syntax-highlighting must be last among completion/suggestion plugins
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"

[plugins.zoxide]
inline = 'eval "$(zoxide init zsh)"'

[plugins.direnv]
inline = 'eval "$(direnv hook zsh)"'

[plugins.starship]
inline = 'eval "$(starship init zsh)"'
