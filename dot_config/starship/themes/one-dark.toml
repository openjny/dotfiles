"$schema" = 'https://starship.rs/config-schema.json'

# Pastel Powerline inspired — 2-line prompt
# Line 1: [directory] > [git] > [languages] > [env/infra]
# Line 2: character (input)

command_timeout = 500

format = """
$directory[\uE0B0](fg:#E06C75 bg:#D19A66)$git_branch$git_status[\uE0B0](fg:#D19A66 bg:#61AFEF)$python$nodejs$golang$rust$java$terraform[\uE0B0](fg:#61AFEF bg:#98C379)$azure$kubernetes$docker_context[\uE0B0](fg:#98C379)$fill$cmd_duration$line_break$character"""

right_format = ""

[fill]
symbol = " "

[username]
show_always = false
style_user = "bg:#C678DD fg:#282C34"
style_root = "bg:#C678DD fg:#282C34"
format = '[$user ]($style)'

[os]
style = "bg:#C678DD fg:#282C34"
disabled = true

[character]
success_symbol = "[  \u276F](bold #C678DD)"
error_symbol = "[ ✘ \u276F](italic #E06C75)"
vimcmd_symbol = "[\u276E](bold #D19A66)"

[directory]
style = "bg:#E06C75 fg:#282C34"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "\u2026/"
truncate_to_repo = false

[directory.substitutions]
"~" = " ~"

[git_branch]
symbol = "\uE0A0"
style = "bg:#D19A66 fg:#282C34"
format = '[ $symbol $branch(:$remote_branch) ]($style)'

[git_status]
style = "bg:#D19A66 fg:#282C34"
format = '([$all_status$ahead_behind ]($style))'
ahead = "\uF0AA $count"
behind = "\uF0AB $count"
diverged = "\uF5FA $count"
conflicted = "\uF06A $count"
untracked = "\uF059 $count"
stashed = "\uF692 $count"
modified = "\uF071 $count"
staged = "\uF067 $count"
renamed = "\uF45A $count"
deleted = "\uFAE7 $count"

[python]
symbol = " "
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = ""
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol ($version) ]($style)'

[terraform]
style = "bg:#61AFEF fg:#282C34"
format = '[ $symbol$workspace ]($style)'

[azure]
disabled = false
style = "bg:#98C379 fg:#282C34"
format = '[ $symbol]($style)'

[kubernetes]
disabled = false
style = "bg:#98C379 fg:#282C34"
format = '[ $symbol$context(\($namespace\)) ]($style)'

[docker_context]
symbol = " "
style = "bg:#98C379 fg:#282C34"
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 5000
format = "[ $duration]($style) "
style = "yellow bold"

[time]
disabled = true
