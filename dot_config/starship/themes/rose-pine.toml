"$schema" = 'https://starship.rs/config-schema.json'

# Pastel Powerline inspired — 2-line prompt
# Line 1: [directory] > [git] > [languages] > [env/infra]
# Line 2: character (input)

command_timeout = 500

format = """
$directory[\uE0B0](fg:#EB6F92 bg:#F6C177)$git_branch$git_status[\uE0B0](fg:#F6C177 bg:#9CCFD8)$python$nodejs$golang$rust$java$terraform[\uE0B0](fg:#9CCFD8 bg:#31748F)$azure$kubernetes$docker_context[\uE0B0](fg:#31748F)$fill$cmd_duration$line_break$character"""

right_format = ""

[fill]
symbol = " "

[username]
show_always = false
style_user = "bg:#C4A7E7 fg:#191724"
style_root = "bg:#C4A7E7 fg:#191724"
format = '[$user ]($style)'

[os]
style = "bg:#C4A7E7 fg:#191724"
disabled = true

[character]
success_symbol = "[  \u276F](bold #C4A7E7)"
error_symbol = "[ ✘ \u276F](italic #EB6F92)"
vimcmd_symbol = "[\u276E](bold #F6C177)"

[directory]
style = "bg:#EB6F92 fg:#191724"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "\u2026/"
truncate_to_repo = false

[directory.substitutions]
"~" = " ~"

[git_branch]
symbol = "\uE0A0"
style = "bg:#F6C177 fg:#191724"
format = '[ $symbol $branch(:$remote_branch) ]($style)'

[git_status]
style = "bg:#F6C177 fg:#191724"
format = '([$all_status$ahead_behind ]($style))'
ahead = '[$count]'
behind = '[$count]'
diverged = '[$count]'
conflicted = '[$count]'
untracked = '[$count]'
stashed = '[$count]'
modified = '[$count]'
staged = '[$count]'
renamed = '[$count]'
deleted = '[$count]'

[python]
symbol = " "
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = ""
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol ($version) ]($style)'

[terraform]
style = "bg:#9CCFD8 fg:#191724"
format = '[ $symbol$workspace ]($style)'

[azure]
disabled = false
style = "bg:#31748F fg:#191724"
format = '[ $symbol]($style)'

[kubernetes]
disabled = false
style = "bg:#31748F fg:#191724"
format = '[ $symbol$context(\($namespace\)) ]($style)'

[docker_context]
symbol = " "
style = "bg:#31748F fg:#191724"
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 5000
format = "[ $duration]($style) "
style = "yellow bold"

[time]
disabled = true
