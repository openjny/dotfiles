"$schema" = 'https://starship.rs/config-schema.json'

# Pastel Powerline inspired — 2-line prompt
# Line 1: [directory] > [git] > [languages] > [env/infra]
# Line 2: character (input)

command_timeout = 500

format = """
$directory[\uE0B0](fg:#CC241D bg:#D79921)$git_branch$git_status[\uE0B0](fg:#D79921 bg:#458588)$python$nodejs$golang$rust$java$terraform[\uE0B0](fg:#458588 bg:#689D6A)$azure$kubernetes$docker_context[\uE0B0](fg:#689D6A)$fill$cmd_duration$line_break$character"""

right_format = ""

[fill]
symbol = " "

[username]
show_always = false
style_user = "bg:#EBDBB2 fg:#1D2021"
style_root = "bg:#EBDBB2 fg:#1D2021"
format = '[$user ]($style)'

[os]
style = "bg:#EBDBB2 fg:#1D2021"
disabled = true

[character]
success_symbol = "[  \u276F](bold #EBDBB2)"
error_symbol = "[ ✘ \u276F](italic #CC241D)"
vimcmd_symbol = "[\u276E](bold #D79921)"

[directory]
style = "bg:#CC241D fg:#1D2021"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "\u2026/"
truncate_to_repo = false

[directory.substitutions]
"~" = " ~"

[git_branch]
symbol = "\uE0A0"
style = "bg:#D79921 fg:#1D2021"
format = '[ $symbol $branch(:$remote_branch) ]($style)'

[git_status]
style = "bg:#D79921 fg:#1D2021"
format = '([$all_status$ahead_behind ]($style))'
ahead = '[$count]'
behind = '[$count]'
diverged = '[$count]'
conflicted = '[$count]'
untracked = '[$count]'
stashed = '[$count]'
modified = '[$count]'
staged = '[$count]'
renamed = '[$count]'
deleted = '[$count]'

[python]
symbol = " "
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = ""
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol ($version) ]($style)'

[terraform]
style = "bg:#458588 fg:#1D2021"
format = '[ $symbol$workspace ]($style)'

[azure]
disabled = false
style = "bg:#689D6A fg:#1D2021"
format = '[ $symbol]($style)'

[kubernetes]
disabled = false
style = "bg:#689D6A fg:#1D2021"
format = '[ $symbol$context(\($namespace\)) ]($style)'

[docker_context]
symbol = " "
style = "bg:#689D6A fg:#1D2021"
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 5000
format = "[ $duration]($style) "
style = "yellow bold"

[time]
disabled = true
