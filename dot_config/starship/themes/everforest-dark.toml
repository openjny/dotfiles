"$schema" = 'https://starship.rs/config-schema.json'

# Pastel Powerline inspired — 2-line prompt
# Line 1: [directory] > [git] > [languages] > [env/infra]
# Line 2: character (input)

command_timeout = 500

format = """
[\uE0B6](fg:#E67E80)$directory[\uE0B0](fg:#E67E80 bg:#DBBC7F)$git_branch$git_status[\uE0B0](fg:#DBBC7F bg:#7FBBB3)$python$nodejs$golang$rust$java$terraform[\uE0B0](fg:#7FBBB3 bg:#A7C080)$azure$kubernetes$docker_context[\uE0B0](fg:#A7C080)$fill$cmd_duration$line_break$character"""

right_format = ""

[fill]
symbol = " "

[username]
show_always = false
style_user = "bg:#D699B6 fg:#272E33"
style_root = "bg:#D699B6 fg:#272E33"
format = '[$user ]($style)'

[os]
style = "bg:#D699B6 fg:#272E33"
disabled = true

[character]
success_symbol = "[  \u276F](bold #D699B6)"
error_symbol = "[ ✘ \u276F](italic #E67E80)"
vimcmd_symbol = "[\u276E](bold #DBBC7F)"

[directory]
style = "bg:#E67E80 fg:#272E33"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "\u2026/"
truncate_to_repo = false

[directory.substitutions]
"~" = " ~"

[git_branch]
symbol = "\uE0A0"
style = "bg:#DBBC7F fg:#272E33"
format = '[ $symbol $branch(:$remote_branch) ]($style)'

[git_status]
style = "bg:#DBBC7F fg:#272E33"
format = '([$all_status$ahead_behind ]($style))'
ahead = "\uF0AA $count"
behind = "\uF0AB $count"
diverged = "\uF5FA $count"
conflicted = "\uF06A $count"
untracked = "\uF059 $count"
stashed = "\uF692 $count"
modified = "\uF071 $count"
staged = "\uF067 $count"
renamed = "\uF45A $count"
deleted = "\uFAE7 $count"

[python]
symbol = " "
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = ""
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol ($version) ]($style)'

[terraform]
style = "bg:#7FBBB3 fg:#272E33"
format = '[ $symbol$workspace ]($style)'

[azure]
disabled = false
style = "bg:#A7C080 fg:#272E33"
format = '[ $symbol]($style)'

[kubernetes]
disabled = false
style = "bg:#A7C080 fg:#272E33"
format = '[ $symbol$context(\($namespace\)) ]($style)'

[docker_context]
symbol = " "
style = "bg:#A7C080 fg:#272E33"
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 5000
format = "[ $duration]($style) "
style = "yellow bold"

[time]
disabled = true
